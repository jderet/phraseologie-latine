# PostgreSQL pour le développement local : docker compose up -d
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: phraseologie
      POSTGRES_USER: phraseologie
      POSTGRES_PASSWORD: phraseologie
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
