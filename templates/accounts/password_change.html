{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Changer de mot de passe" %} · {{ block.super }}{% endblock %}

{% block content %}
<section class="page-narrow">
  <h1>{% translate "Changer de mot de passe" %}</h1>
  <form method="post" class="form">
    {% csrf_token %}
    {{ form }}
    <button type="submit" class="button">{% translate "Changer le mot de passe" %}</button>
  </form>
  <p class="form-links"><a href="{% url 'accounts:account' %}">{% translate "Annuler" %}</a></p>
</section>
{% endblock %}
