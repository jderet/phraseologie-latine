{% load i18n corpus_tags %}<div class="annotate-panel">
  <p class="eyebrow"><a href="{% url 'notebook:notebook' %}">{% translate "Mon carnet" %}</a></p>
  {% if errors %}
  <ul class="errorlist">{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>
  {% else %}
  <h2 class="word-panel-title">{% translate "Note privée" %}</h2>
  <p><a class="hit-ref" href="{{ quote.url }}">{{ quote.citation }}</a> <span class="kwic" lang="la">… {% render_tokens quote.words quote.highlighted %} …</span></p>
  <form method="post" action="{% url 'notebook:note_create' %}" class="form">
    {% csrf_token %}
    <input type="hidden" name="words" value="{{ words }}">
    <input type="hidden" name="next" value="{{ back }}">
    {{ form }}
    <button type="submit" class="button">{% translate "Garder la note" %}</button>
  </form>
  {% endif %}
</div>
