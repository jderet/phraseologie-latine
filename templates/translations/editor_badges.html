{% load i18n %}<span class="row-badges"><span class="status-dot status-{{ row.data.status }}" data-status-dot title="{% if row.data.status == 'todo' %}{% translate 'à traduire' %}{% elif row.data.status == 'draft' %}{% translate 'brouillon' %}{% elif row.data.status == 'translated' %}{% translate 'traduite' %}{% else %}{% translate 'relue' %}{% endif %}"></span>{% if row.alerts %}<a class="alert-badge" href="{% url 'translations:quality_report' version.pk %}#phrase-{{ row.number }}" title="{% for alert in row.alerts %}{{ alert.label }}{% if not forloop.last %} ; {% endif %}{% endfor %}">⚠ {{ row.alerts|length }}</a>{% endif %}{% if row.open_comments %}<span class="comment-badge" title="{% translate 'commentaires ouverts' %}">{{ row.open_comments }} ✎</span>{% endif %}</span>
