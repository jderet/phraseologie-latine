{% load i18n %}{% if variants %}
<ul class="variant-list">
  {% for variant in variants %}{% include "translations/variant_item.html" %}{% endfor %}
</ul>
{% else %}
<p class="note">{% translate "Aucune variante pour cette phrase." %}</p>
{% endif %}
{% if can_add_variant %}<p><a class="small-link" href="{% url 'translations:variant_create' version.pk segment.pk %}">{% translate "Proposer une variante" %}</a></p>{% endif %}
